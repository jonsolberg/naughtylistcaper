name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret – the APK will be debug-signed and not published as a release."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: naughty-list-caper-apk
          path: out/app.apk

      # Only a release-signed APK is published: a debug-signed one would not install over the app
      # people already have from jonsolberg.se.
      - name: Publish release
        if: env.SIGNING_KEYSTORE != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle* | head -1)
          TAG="v$VERSION"
          # Fixed name, so releases/latest/download/NaughtyListCaper.apk always points at the newest build.
          cp out/app.apk NaughtyListCaper.apk
          cp out/app.apk "NaughtyListCaper-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "NaughtyListCaper-$VERSION.apk" NaughtyListCaper.apk --clobber
          else
            gh release create "$TAG" "NaughtyListCaper-$VERSION.apk" NaughtyListCaper.apk --target "$GITHUB_SHA" \
              --title "The Naughty List Caper $VERSION" --notes "Built from ${GITHUB_SHA::7}." --latest
          fi
